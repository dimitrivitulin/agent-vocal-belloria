name: belloria-cloud

services:
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      BELLORIA_MCP_DOMAIN: ${BELLORIA_MCP_DOMAIN:?BELLORIA_MCP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      belloria-mcp:
        condition: service_healthy
    restart: unless-stopped

  belloria-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      BELLORIA_MCP_TOKEN: ${BELLORIA_MCP_TOKEN:?BELLORIA_MCP_TOKEN is required}
      WHATSAPP_PROVIDER: waha
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required}
      WAHA_BASE_URL: http://waha:3000
      WAHA_SESSION: ${WAHA_SESSION:-default}
      MCP_HOST: 0.0.0.0
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      - waha
    restart: unless-stopped

  webhook-receiver:
    image: python:3.13.7-alpine3.22
    command: ["python", "/app/tools/webhook_receiver.py"]
    environment:
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: "8080"
      WEBHOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:?WAHA_WEBHOOK_HMAC_KEY is required}
      WEBHOOK_EVENTS_FILE: /data/events.ndjson
    volumes:
      - ./tools:/app/tools:ro
      - webhook_events:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  waha:
    image: ${WAHA_IMAGE:?WAHA_IMAGE must use a versioned tag}
    depends_on:
      webhook-receiver:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:?WAHA_DASHBOARD_USERNAME is required}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD is required}
      WAHA_PRINT_QR: "false"
      WAHA_LOG_LEVEL: info
      WHATSAPP_HOOK_URL: http://webhook-receiver:8080/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message,message.any,session.status
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:?WAHA_WEBHOOK_HMAC_KEY is required}
      WHATSAPP_HOOK_RETRIES_POLICY: linear
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "2"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "4"
    volumes:
      - waha_sessions:/app/.sessions
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  caddy_config:
  caddy_data:
  waha_sessions:
  webhook_events:
