name: belloria-waha

services:
  webhook-receiver:
    image: python:3.13-alpine
    command: ["python", "/app/tools/webhook_receiver.py"]
    environment:
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: "8080"
      WEBHOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:?WAHA_WEBHOOK_HMAC_KEY is required}
      WEBHOOK_EVENTS_FILE: /data/events.ndjson
    volumes:
      - ./tools:/app/tools:ro
      - ./.webhook-events:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:noweb
    depends_on:
      webhook-receiver:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:?WAHA_DASHBOARD_USERNAME is required}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD is required}
      WAHA_PRINT_QR: "false"
      WAHA_LOG_LEVEL: info
      WHATSAPP_HOOK_URL: http://webhook-receiver:8080/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message,message.any,session.status
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:?WAHA_WEBHOOK_HMAC_KEY is required}
      WHATSAPP_HOOK_RETRIES_POLICY: linear
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "2"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "4"
    volumes:
      - ./.sessions:/app/.sessions
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

